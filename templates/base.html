<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenClaw API Permission Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container-fluid d-flex justify-content-between">
        <span class="navbar-brand mb-0 h1">OpenClaw API Permission Manager</span>
        {% if admin_username %}
        <div class="d-flex align-items-center gap-2">
          <span class="text-white-50 small">Signed in as {{ admin_username }}</span>
          <button class="btn btn-sm btn-outline-light" onclick="logoutWebUi()">Logout</button>
        </div>
        {% endif %}
      </div>
    </nav>
    <main class="container pb-5">{% block content %}{% endblock %}</main>
    <script src="/static/app.js?v=6"></script>
  </body>
</html>
